name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r requirements-ci.txt
      - run: bash scripts/install-promtool.sh "$RUNNER_TEMP"
      - run: echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: python -m pytest -q
      - run: ruff check alertshadow tests
      - run: mypy --strict alertshadow
      - run: python -m alertshadow project --root examples
      - run: python -m alertshadow test --root examples
      - run: python -m build --no-isolation
      - run: python -m pip install --no-deps dist/*.whl
      - run: cd /tmp && alertshadow --help
